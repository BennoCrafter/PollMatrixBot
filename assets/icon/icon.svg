<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="#F4633A"/>

  <!-- subtle bottom shade circle for depth (flat, no gradient) -->
  <circle cx="256" cy="256" r="256" fill="#F4633A"/>

  <!-- bowl -->
  <g>
    <!-- bowl body -->
    <path d="M 146 270
             a 110 110 0 0 0 220 0
             Z"
          fill="#FFFFFF"/>
    <!-- bowl rim -->
    <ellipse cx="256" cy="270" rx="110" ry="18" fill="#FFF3EC"/>
    <ellipse cx="256" cy="270" rx="110" ry="18" fill="none" stroke="#E8E2DC" stroke-width="3"/>
    <!-- bowl base foot -->
    <rect x="236" y="378" width="40" height="14" rx="7" fill="#FFFFFF"/>

    <!-- food bits in bowl -->
    <circle cx="215" cy="262" r="12" fill="#F4633A"/>
    <circle cx="256" cy="250" r="14" fill="#2E9E7A"/>
    <circle cx="298" cy="264" r="11" fill="#F5B841"/>
    <rect x="230" y="272" width="52" height="8" rx="4" fill="#F5B841"/>
  </g>

  <!-- chopsticks crossing over bowl -->
  <g stroke="#7A4A2B" stroke-width="7" stroke-linecap="round">
    <line x1="176" y1="150" x2="300" y2="252"/>
    <line x1="200" y1="140" x2="316" y2="236"/>
  </g>

</svg>
